<div class="login-container d-flex justify-content-center align-items-center vh-100">
    <div class="login-card text-center p-4 shadow">
      <div class="icon-circle mb-3 mx-auto">
        <i class="fa fa-user fa-2x text-white"></i>
      </div>
  
      <h4 class="text-white mb-4">{{ isLoginPage ? 'Login' : 'Register' }}</h4>
  
      <form (submit)="isLoginPage ? login() : register()">
        <div class="form-group mb-3">
          <input type="email" class="form-control" placeholder="Email ID"
            [(ngModel)]="email" name="email" required />
        </div>
  
        <div class="form-group mb-3">
          <input type="password" class="form-control" placeholder="Password"
            [(ngModel)]="password" name="password" required />
        </div>
  
        <div class="d-flex justify-content-between mb-3 text-white">
          <div>
            <input type="checkbox" id="remember" /> <label for="remember">Remember me</label>
          </div>
          <a href="#" class="text-light">Forgot Password?</a>
        </div>
  
        <button type="submit" class="btn login-btn w-100 mb-3">
          {{ isLoginPage ? 'LOGIN' : 'REGISTER' }}
        </button>
  
        <div class="text-white">
          <small>
            {{ isLoginPage ? "Don't have an account?" : "Already have an account?" }}
            <a href="#" (click)="togglePage()" class="text-warning ms-1">
              {{ isLoginPage ? 'Register' : 'Login' }}
            </a>
          </small>
        </div>
      </form>
    </div>
  </div>
